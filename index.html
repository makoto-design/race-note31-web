'use strict';const archive=JSON.parse(document.querySelector('#prediction-archive').textContent),days=Object.keys(archive).sort().reverse();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=v=>v==null?'—':(Number(v)*100).toFixed(1)+'%';const select=document.querySelector('#day-select');select.innerHTML=days.map(day=>'<option value="'+esc(day)+'">'+esc(day)+'</option>').join('');document.querySelector('#day-count').textContent=days.length+'開催日を保存';
function summary(data){const fixed=data.races.filter(r=>r.fixed).length,results=data.races.filter(r=>r.winner).length;document.querySelector('#summary').innerHTML='<span class="badge">'+data.races.length+'レース</span><span class="badge">予想済み '+fixed+'</span><span class="badge">結果あり '+results+'</span>'}
function raceList(data){const groups=data.races.reduce((a,r)=>{(a[r.venue]??=[]).push(r);return a},{});return data.races.length?Object.entries(groups).map(([venue,races])=>'<section class="venue"><div class="venue-head"><h2>'+esc(venue)+'</h2><span>'+races.length+'レース</span></div>'+races.map(r=>{const hit=r.winner&&r.leaders[0]&&String(r.winner)===String(r.leaders[0].number);const href='?date='+encodeURIComponent(data.day)+'&race='+encodeURIComponent(r.race_id);return '<article class="race"><div><span class="num">'+r.number+'R</span><br><small class="muted">'+esc(r.start_time||'時刻未定')+' · '+esc(r.course)+' '+esc(r.distance)+'m</small></div><div><b>'+esc(r.name||'名称未設定')+'</b><br><small class="muted">'+(r.fixed?(r.retrospective?'過去検証':'最終予想'):'予想前')+'</small></div><div class="picks">'+(r.leaders.length?r.leaders.map((c,i)=>'<span class="pick"><b>'+['◎','○','▲'][i]+' '+c.number+'</b> '+esc(c.name)+' '+pct(c.probability)+'</span>').join(''):'<span class="muted">予想はまだありません</span>')+'</div><div>'+(r.winner?'<span class="muted">1着</span><br><span class="winner">'+r.winner+'番</span><br>'+(hit?'<small class="hit">本命的中</small><br>':''):'<span class="muted">結果待ち</span><br>')+'<a class="detail-link" data-race="'+esc(r.race_id)+'" href="'+href+'">詳細を見る →</a></div></article>'}).join('')+'</section>').join(''):'<div class="empty">この日の公開予想はまだありません。</div>'}
function raceDetail(data,race){const horses=race.horses||[];const body=horses.length?'<div class="table-scroll"><table class="horse-table"><thead><tr><th>予想順位</th><th>馬番・馬名</th><th>総合点</th><th>勝率</th><th>3着内率</th><th>結果</th></tr></thead><tbody>'+horses.map(h=>'<tr class="'+(h.rank&&h.rank<=3?'top':'')+'"><td><span class="rank">'+(h.rank??'—')+'</span></td><td><b>'+h.number+' '+esc(h.name)+'</b>'+(h.status!=='active'?'<br><small class="muted">'+esc(h.status)+'</small>':'')+'</td><td>'+Number(h.score).toFixed(2)+'</td><td>'+pct(h.probability)+'</td><td>'+pct(h.place_probability)+'</td><td>'+(h.finish?'<b>'+h.finish+'着</b>':'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">このレースは31項目予想の対象外です。</div>';return '<div class="detail-head"><div><button class="back-link" id="back-to-list">← '+esc(data.day)+' のレース一覧へ</button><h1>'+esc(race.venue)+' '+race.number+'R · '+esc(race.name)+'</h1><p class="muted">'+esc(race.start_time||'時刻未定')+' · '+esc(race.course)+' '+esc(race.distance)+'m</p></div><span class="badge">'+(race.fixed?(race.retrospective?'過去検証':'最終予想'):'予想前')+'</span></div><section class="detail-card"><div class="venue-head"><h2>全出走馬の予想</h2><span>'+horses.length+'頭</span></div>'+body+'</section>'}
function setUrl(day,raceId,push){const url=new URL(location.href);url.searchParams.set('date',day);if(raceId)url.searchParams.set('race',raceId);else url.searchParams.delete('race');history[push?'pushState':'replaceState'](null,'',url)}
function show(day,raceId,push=false){const data=archive[day]||archive[days[0]];select.value=data.day;summary(data);const race=data.races.find(r=>r.race_id===raceId);if(race){document.title=race.name+' · '+data.day+' 公開予想';document.querySelector('#title').style.display='none';document.querySelector('#races').innerHTML=raceDetail(data,race)}else{document.title=data.day+' 公開予想 · RACE NOTE 31';document.querySelector('#title').style.display='';document.querySelector('#title').textContent=data.day+' の予想';document.querySelector('#races').innerHTML=raceList(data)}document.querySelector('#updated').textContent='更新 '+new Date(data.generated_at).toLocaleString('ja-JP')+' · 31項目エンジンの保存済み予想';setUrl(data.day,race?.race_id,push)}
select.onchange=()=>show(select.value,null,true);document.querySelector('#races').addEventListener('click',event=>{const link=event.target.closest('[data-race]');if(link){event.preventDefault();show(select.value,link.dataset.race,true);scrollTo({top:0,behavior:'smooth'});return}if(event.target.closest('#back-to-list')){show(select.value,null,true);scrollTo({top:0,behavior:'smooth'})}});addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);show(p.get('date'),p.get('race'),false)});const requested=new URLSearchParams(location.search);show(days.includes(requested.get('date'))?requested.get('date'):'2026-09-21',requested.get('race'),false);
</script></body></html>
